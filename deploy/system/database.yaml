apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
# Credentials and schema ConfigMap are injected at runtime, never stored here.
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  containers:
    - name: postgres
      image: postgres:17-alpine
      env:
        - name: POSTGRES_USER
          value: cache
        - name: POSTGRES_DB
          value: products
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: products
              key: POSTGRES_PASSWORD
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: schema
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
      # The initialization server has no TCP listener; readiness follows schema init.
      readinessProbe:
        tcpSocket:
          port: 5432
        periodSeconds: 2
        timeoutSeconds: 1
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: postgres-data
    - name: schema
      configMap:
        name: product-schema
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
