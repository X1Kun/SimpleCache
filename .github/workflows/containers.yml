name: Container builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: geecache-engine
            image: simplecache-engine
          - module: simplecache-operator
            image: simplecache-operator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image without publishing
        run: docker build --tag ${{ matrix.image }}:ci ${{ matrix.module }}
