name: CI

on:
  # Automatic runs are temporarily paused during architecture development.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: simplecache-operator/go.mod
          cache: true
          cache-dependency-path: |
            geecache-engine/go.sum
            simplecache-operator/go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Run static analysis
        run: make vet

      - name: Run engine race tests and diagnostic reports
        run: make validate

      - name: Compile engine and Operator
        run: make build

      - name: Validate Compose configuration
        run: make compose-config

      - name: Verify fresh-volume PostgreSQL readiness
        run: bash scripts/products/check-startup.sh

      - name: Validate generated files and render Kubernetes manifests
        run: |
          make generated-check
          make k8s-render

      - name: Upload engine reports, profiles and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-validation
          path: bin/reports/
          if-no-files-found: ignore

  operator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: simplecache-operator/go.mod
          cache: true
          cache-dependency-path: |
            geecache-engine/go.sum
            simplecache-operator/go.sum

      - name: Run Operator API-server tests
        run: make test-operator-ci

      - name: Upload Operator report and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-validation
          path: bin/reports/
          if-no-files-found: ignore

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: simplecache
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: simplecache
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U simplecache -d simplecache"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: geecache-engine/go.mod
          cache-dependency-path: geecache-engine/go.sum
      - name: Initialize isolated product schema
        env:
          PGPASSWORD: integration-only-password
        run: psql -h 127.0.0.1 -U simplecache -d simplecache -v ON_ERROR_STOP=1 -f deploy/products/schema.sql
      - name: Verify PostgreSQL startup, writes and three-node invalidation
        working-directory: geecache-engine
        env:
          SIMPLECACHE_TEST_DATABASE_URL: postgres://simplecache:integration-only-password@127.0.0.1:5432/simplecache?sslmode=disable
        run: go test -race -count=1 -timeout=2m -run '^TestPostgres(OpenChecksExecutionErrors|SchemaMigration|ConditionalWrites|ProductLifecycle|VersionedInvalidation)$' -v ./internal/source/postgres ./internal/app
      - name: Smoke-test paired PostgreSQL workloads
        env:
          SIMPLECACHE_COMPARE_DATABASE_URL: postgres://simplecache:integration-only-password@127.0.0.1:5432/simplecache?sslmode=disable
          COMPARE_QUICK: "1"
        run: make postgres-compare
      - name: Upload PostgreSQL comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-comparison
          path: bin/reports/*-postgres-compare-*/
          if-no-files-found: ignore
